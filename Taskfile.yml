# Development tasks, run with Task (https://taskfile.dev): `task <name>`, or `task --list` to see
# them all. CI installs Task 3.53.1 with go-task/setup-task.
version: "3"

tasks:
  default:
    desc: Run every check CI runs
    cmds:
      - task: check

  check:
    desc: Run every check CI runs (format, tidy, vet, lint, test, commit policy, build)
    cmds:
      - task: fmt-check
      - task: tidy-check
      - task: vet
      - task: lint
      - task: test
      - task: policy
      - task: next-version
      - task: build

  fmt:
    desc: Format Go code
    cmds:
      - gofmt -w .

  fmt-check:
    desc: Fail if any Go file needs formatting
    cmds:
      - |
        unformatted="$(gofmt -l .)"
        if [ -n "$unformatted" ]; then
          echo "run 'task fmt' to format:"
          echo "$unformatted"
          exit 1
        fi

  tidy-check:
    desc: Fail if go.mod or go.sum need tidying
    cmds:
      - go mod tidy -diff

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run

  test:
    desc: Run tests with the race detector
    cmds:
      - go test -race -count=1 ./...

  policy:
    desc: Test the commit policy checker
    cmds:
      - scripts/commit-policy.test.sh

  next-version:
    desc: Test the version bump script
    cmds:
      - scripts/next-version.test.sh

  build:
    desc: Build bin/loomlc
    vars:
      VERSION:
        sh: git describe --tags --always --dirty 2>/dev/null || echo dev
    cmds:
      - go build -trimpath -ldflags "-X github.com/stritech-oss/loomlc/internal/version.Version={{.VERSION}}" -o bin/loomlc ./cmd/loomlc

  dist:
    desc: Cross-compile the release archives and checksums into dist/
    vars:
      VERSION:
        sh: git describe --tags --always --dirty 2>/dev/null || echo dev
      # Unix only. Elsewhere, cancelling a step can't stop the processes it started
      # (internal/proc/proc_other.go), so loomlc isn't shipped for those platforms.
      TARGETS: linux/amd64 linux/arm64 darwin/amd64 darwin/arm64
    cmds:
      - rm -rf dist
      - |
        set -eu
        mkdir -p dist
        for target in {{.TARGETS}}; do
          os="${target%/*}"
          arch="${target#*/}"
          name="loomlc_{{.VERSION}}_${os}_${arch}"
          mkdir -p "dist/${name}"
          CGO_ENABLED=0 GOOS="${os}" GOARCH="${arch}" go build -trimpath \
            -ldflags "-X github.com/stritech-oss/loomlc/internal/version.Version={{.VERSION}}" \
            -o "dist/${name}/loomlc" ./cmd/loomlc
          cp LICENSE README.md "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          rm -rf "dist/${name}"
        done
        cd dist && sha256sum ./*.tar.gz > checksums.txt
