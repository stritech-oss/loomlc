version: "2"

# Import-boundary rules (depguard: engine vs adapters) and further API bans land with the packages
# they govern, so each rule is tested against a real violation when it's added.

linters:
  default: standard
  enable:
    - bodyclose
    - depguard
    - errorlint
    - forbidigo
    - gosec
    - misspell
    - nolintlint
    - unparam
  settings:
    depguard:
      rules:
        adapters:
          files:
            - "**/internal/provider/*/*.go"
            - "**/internal/executor/*/*.go"
          deny:
            - pkg: github.com/stritech-oss/loomlc/internal/provider/
              desc: adapters don't import provider adapters; share code through internal/provider (docs/conventions.md)
            - pkg: github.com/stritech-oss/loomlc/internal/executor/
              desc: adapters don't import executor adapters; share code through internal/executor (docs/conventions.md)
            - pkg: github.com/stritech-oss/loomlc/internal/config
              desc: adapters get their settings from the caller, not from loomlc.yml (docs/conventions.md)
            - pkg: github.com/stritech-oss/loomlc/internal/cli
              desc: adapters don't depend on the command line (docs/conventions.md)
    forbidigo:
      forbid:
        - pattern: ^exec\.Command(Context)?$
          msg: run subprocesses through internal/proc (docs/conventions.md)
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    rules:
      - path: internal/proc/
        linters:
          - forbidigo
      # Tests write fixtures to temp paths and re-run their own binary as a helper process; gosec's
      # taint checks only add noise there.
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/stritech-oss/loomlc
