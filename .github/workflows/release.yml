# A release is a version, cut either way: run this workflow and name the bump (and a commit on main,
# if not its head), or push a signed v* tag yourself. See docs/contributing.md#releases.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      bump:
        description: Which part to raise, unless an exact version is given
        type: choice
        options: [patch, minor, major, prerelease]
        default: patch
      version:
        description: An exact version instead, such as v0.1.0
        type: string
      commit:
        description: A commit on main to release instead of the dispatched ref's head
        type: string

permissions:
  contents: read

jobs:
  release:
    name: Build and publish binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write # creates the tag and the release, and uploads the archives
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit }} # empty checks out the dispatched ref; a sha that resolves to nothing fails here
          fetch-depth: 0 # the version is read from the tags, which a shallow clone doesn't have

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"

      - uses: go-task/setup-task@v2
        with:
          version: 3.53.1

      # However it was started, a release comes from what main already carries: a tag on an
      # unreviewed branch would publish code nobody merged.
      - name: Check the commit is on main
        run: |
          git fetch --quiet origin main
          sha=$(git rev-parse HEAD)
          git merge-base --is-ancestor "$sha" origin/main ||
            { echo "::error::$sha is not on origin/main, so it is not releasable"; exit 1; }

      - name: Work out the version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          EXACT: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            tag=$GITHUB_REF_NAME # the tag that started this is the version
          else
            # A bump counts from the highest tag, so on a commit that doesn't descend from it the
            # result would be numerically newer than its content. An exact version is the way out.
            if [ -n "$COMMIT" ] && [ -z "$EXACT" ]; then
              latest=$(git -c versionsort.suffix=- tag --list 'v*' --sort=-v:refname | head -1)
              if [ -n "$latest" ] && ! git merge-base --is-ancestor "$latest" HEAD; then
                echo "::error::$(git rev-parse HEAD) does not descend from the latest release $latest, so a bump would name a newer version for older content; pass an exact version to release it anyway"
                exit 1
              fi
            fi
            tag=$(scripts/next-version.sh "${EXACT:-$BUMP}")
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Releasing \`$tag\` from \`$(git rev-parse HEAD)\`" >> "$GITHUB_STEP_SUMMARY"

      # Before any tag is written, so a commit that fails doesn't leave one behind. A tag can point
      # at any commit, which is why these run here at all rather than being trusted from the Go
      # workflow's run on another one. Lint stays there: it judges the source, not the artifact.
      - name: go vet
        run: task vet

      - name: go test
        run: task test

      # A tag pushed with this token deliberately doesn't start another workflow run, so this job
      # goes on to build and publish it rather than waiting for the push trigger.
      - name: Tag it
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"

      - name: Cross-compile
        run: task dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # A version with a prerelease identifier is published as one, so it isn't offered as the
          # latest release.
          marks=()
          case "$TAG" in *-*) marks+=(--prerelease) ;; esac
          gh release create "$TAG" dist/*.tar.gz dist/checksums.txt \
            --title "$TAG" --generate-notes --verify-tag "${marks[@]}"
